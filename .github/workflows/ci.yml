name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.12"]
        include:
          # one job runs the long bootstrap checks and reports coverage
          - os: ubuntu-latest
            python: "3.12"
            full: true

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[gui,test]"

      # PyQt5 needs an X server on Linux; the analysis layer does not, but the
      # GUI import test does.
      - name: Qt runtime libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-xfixes0

      - name: Tests
        env:
          QT_QPA_PLATFORM: offscreen
          MPLBACKEND: Agg
        run: |
          pytest -m "not slow" -q

      - name: Reference and bootstrap tests
        if: matrix.full
        env:
          QT_QPA_PLATFORM: offscreen
          MPLBACKEND: Agg
        run: |
          pytest -q --cov=pleap --cov-report=term-missing --cov-report=xml

      - name: Upload coverage
        if: matrix.full
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml

  package:
    name: build and check the distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python -m pip install --upgrade pip build twine
          python -m build
          python -m twine check dist/*
      - name: Install the wheel in a clean environment and import the core
        run: |
          python -m venv /tmp/clean
          /tmp/clean/bin/pip install dist/*.whl
          /tmp/clean/bin/python -c "
          import pleap
          from pleap.core.dea import dea
          import numpy as np
          r = dea(np.array([[1.0],[2.0],[3.0]]), np.array([[1.0],[1.5],[3.0]]),
                  model='CCR', orient='input')
          assert abs(r['efficiency'][2] - 1.0) < 1e-9, r['efficiency']
          print('pleap', pleap.__version__, 'imports and solves without a GUI')
          "
